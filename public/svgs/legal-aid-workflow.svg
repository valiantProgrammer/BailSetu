<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="auto" fill="none">
  <!-- Connecting Horizontal Line -->
  <line x1="120" y1="50" x2="840" y2="50" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
  <line x1="120" y1="50" x2="600" y2="50" stroke="#1E40AF" stroke-width="4" stroke-linecap="round" />

  <!-- Step 1: Applicant Details -->
  <g transform="translate(120, 50)">
    <circle cx="0" cy="0" r="24" fill="#1E40AF" stroke="#DBEAFE" stroke-width="6" />
    <text x="0" y="6" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
    <text x="0" y="44" fill="#0B1F4B" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Applicant Details</text>
    <text x="0" y="62" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">KYC, State &amp; District</text>
  </g>

  <!-- Step 2: Case Details -->
  <g transform="translate(360, 50)">
    <circle cx="0" cy="0" r="24" fill="#1E40AF" stroke="#DBEAFE" stroke-width="6" />
    <text x="0" y="6" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
    <text x="0" y="44" fill="#0B1F4B" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Case Details</text>
    <text x="0" y="62" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Offence &amp; Police Station</text>
  </g>

  <!-- Step 3: Documents Upload -->
  <g transform="translate(600, 50)">
    <circle cx="0" cy="0" r="24" fill="#1E40AF" stroke="#93C5FD" stroke-width="6" />
    <text x="0" y="6" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">3</text>
    <text x="0" y="44" fill="#1E40AF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Documents</text>
    <text x="0" y="62" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">ID Proof &amp; FIR Notice</text>
  </g>

  <!-- Step 4: Review & Legal Aid Allocation -->
  <g transform="translate(840, 50)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />
    <text x="0" y="6" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">4</text>
    <text x="0" y="44" fill="#64748B" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Review &amp; Submit</text>
    <text x="0" y="62" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="500" text-anchor="middle">Tracking ID Generation</text>
  </g>
</svg>
