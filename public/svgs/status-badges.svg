<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 80" width="100%" height="auto" fill="none">
  <!-- Bailable Badge -->
  <g transform="translate(10, 15)">
    <rect width="165" height="48" rx="24" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
    <circle cx="28" cy="24" r="14" fill="#16A34A" />
    <path d="M 23 24 L 27 28 L 34 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="29" fill="#166534" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Bailable</text>
    <text x="115" y="29" fill="#15803D" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600">(जमानती)</text>
  </g>

  <!-- Non-Bailable Badge -->
  <g transform="translate(190, 15)">
    <rect width="185" height="48" rx="24" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5" />
    <circle cx="28" cy="24" r="14" fill="#DC2626" />
    <path d="M 23 19 L 33 29 M 33 19 L 23 29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="29" fill="#991B1B" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Non-Bailable</text>
    <text x="140" y="29" fill="#B91C1C" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600">(गैर-जमानती)</text>
  </g>

  <!-- Depends Badge -->
  <g transform="translate(390, 15)">
    <rect width="155" height="48" rx="24" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5" />
    <circle cx="28" cy="24" r="14" fill="#D97706" />
    <path d="M 28 17 L 28 24 M 28 29 L 28 30" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="29" fill="#92400E" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Depends</text>
    <text x="110" y="29" fill="#B45309" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600">(निर्भर)</text>
  </g>

  <!-- Cognizable Badge -->
  <g transform="translate(560, 15)">
    <rect width="170" height="48" rx="24" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5" />
    <circle cx="28" cy="24" r="14" fill="#2563EB" />
    <path d="M 23 24 L 27 28 L 34 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="29" fill="#1E40AF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Cognizable</text>
    <text x="130" y="29" fill="#1D4ED8" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600">(संज्ञेय)</text>
  </g>

  <!-- Non-Compoundable Badge -->
  <g transform="translate(745, 15)">
    <rect width="165" height="48" rx="24" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="0" />
    <circle cx="28" cy="24" r="14" fill="#EF4444" />
    <path d="M 23 19 L 33 29 M 33 19 L 23 29" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="28" fill="#DC2626" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Non-Compoundable</text>
  </g>
</svg>
