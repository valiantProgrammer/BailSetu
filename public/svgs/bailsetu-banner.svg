<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081636" />
      <stop offset="60%" stop-color="#0B1F4B" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="flagTricolor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGradient)" filter="url(#cardGlow)" />

  <!-- Abstract Tricolor Swoosh Ribbon -->
  <path d="M -50 280 C 250 340, 450 160, 800 240 C 1000 290, 1150 210, 1250 180 L 1250 320 L -50 320 Z" fill="#138808" opacity="0.25" />
  <path d="M -50 260 C 220 310, 420 140, 780 220 C 970 270, 1120 190, 1250 160 L 1250 280 L -50 280 Z" fill="#FFFFFF" opacity="0.15" />
  <path d="M -50 240 C 200 280, 400 120, 750 200 C 950 250, 1100 170, 1250 140 L 1250 240 L -50 240 Z" fill="#FF9933" opacity="0.22" />

  <!-- Scales of Justice Decorative Watermark -->
  <g transform="translate(980, 40)" opacity="0.12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="100" y1="20" x2="100" y2="200" stroke-width="6" />
    <line x1="30" y1="60" x2="170" y2="60" stroke-width="5" />
    <path d="M 30 60 L 5 120 L 55 120 Z" fill="#FFFFFF" fill-opacity="0.05" />
    <path d="M 170 60 L 145 120 L 195 120 Z" fill="#FFFFFF" fill-opacity="0.05" />
    <rect x="70" y="195" width="60" height="15" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Left Content Block -->
  <g transform="translate(60, 65)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.2" />
    <text x="140" y="18" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      INDIAN CIVIC LEGAL TECH PLATFORM
    </text>

    <!-- Main Dual-Color Title -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
        BAIL<tspan fill="url(#saffronGrad)" dx="8" font-family="'Noto Sans Devanagari', 'Inter', sans-serif">सेतु</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="105" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="16" font-weight="500">
      Your Bridge to Legal Information • कानूनी जानकारी का आपका सेतु
    </text>

    <!-- Metric Feature Badges Row -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: IPC & BNS -->
      <g transform="translate(0, 0)">
        <rect width="165" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#38BDF8" stroke-width="1.2" />
        <circle cx="18" cy="17" r="6" fill="#38BDF8" />
        <text x="32" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">IPC &amp; BNS Sections</text>
      </g>
      <!-- Badge 2: Advocate Discovery -->
      <g transform="translate(180, 0)">
        <rect width="165" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#34D399" stroke-width="1.2" />
        <circle cx="18" cy="17" r="6" fill="#34D399" />
        <text x="32" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Advocate Discovery</text>
      </g>
      <!-- Badge 3: 4-Step Legal Aid -->
      <g transform="translate(360, 0)">
        <rect width="165" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FBBF24" stroke-width="1.2" />
        <circle cx="18" cy="17" r="6" fill="#FBBF24" />
        <text x="32" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Free Legal Aid (NALSA)</text>
      </g>
      <!-- Badge 4: Bilingual -->
      <g transform="translate(540, 0)">
        <rect width="145" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#F472B6" stroke-width="1.2" />
        <circle cx="18" cy="17" r="6" fill="#F472B6" />
        <text x="32" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">English | हिंदी (100%)</text>
      </g>
    </g>
  </g>
</svg>
