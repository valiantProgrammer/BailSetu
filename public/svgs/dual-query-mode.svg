<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="100%" height="auto" fill="none">
  <!-- Query Mode 1: Natural Language Description -->
  <g transform="translate(40, 25)">
    <rect width="280" height="130" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" />
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#EFF6FF" />
    <path d="M 30 36 C 30 30, 42 30, 42 36 C 42 40, 36 41, 36 44 M 36 48 L 36 50" stroke="#1E40AF" stroke-width="2" stroke-linecap="round" />
    <text x="64" y="34" fill="#0B1F4B" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Search by Description</text>
    <text x="64" y="48" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Natural language incident facts</text>
    <rect x="18" y="72" width="244" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="93" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">"e.g. stole a mobile phone, hurt..."</text>
  </g>

  <!-- Middle Arrow / Matching Engine -->
  <g transform="translate(360, 50)">
    <rect width="240" height="80" rx="12" fill="#0B1F4B" />
    <text x="120" y="34" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Legal AI &amp; Matching Engine</text>
    <text x="120" y="54" fill="#FDBA74" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">IPC 1860 ↔ BNS 2023 Cross-Ref</text>
    <!-- Left Inflow Arrow -->
    <path d="M -20 40 L 0 40" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />
    <!-- Right Outflow Arrow -->
    <path d="M 240 40 L 260 40" stroke="#1E40AF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Query Mode 2: Section Number -->
  <g transform="translate(640, 25)">
    <rect width="280" height="130" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" />
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#FFF7ED" />
    <text x="36" y="42" fill="#EA580C" font-family="'Inter', sans-serif" font-size="18" font-weight="900" text-anchor="middle">§</text>
    <text x="64" y="34" fill="#0B1F4B" font-family="'Inter', sans-serif" font-size="14" font-weight="800">Search by Section No.</text>
    <text x="64" y="48" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Direct statutory code lookup</text>
    <rect x="18" y="72" width="244" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="93" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">"e.g. 379, 420, BNS 303(2)..."</text>
  </g>
</svg>
